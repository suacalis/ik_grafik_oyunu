<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İK Veri Dedektifi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@4.1.1/plotly.min.js"></script>
<style>
:root{
  --bg:#f6f2e9; --paper:#fffdf8; --ink:#1c2333; --muted:#5d6577; --line:#e3dccd; --grid:#ebe5d8;
  --navy:#16223d; --amber:#e8a33d; --amber-ink:#8a5a12; --ok:#2f8a5b; --bad:#c2453a; --chip:#f1ebdf;
  --shadow:0 1px 2px rgba(22,34,61,.06),0 8px 24px rgba(22,34,61,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1524; --paper:#161e31; --ink:#e7e9ef; --muted:#9aa3b5; --line:#263049; --grid:#222b41;
  --navy:#0b1120; --amber:#f0b45a; --amber-ink:#f0b45a; --ok:#4cc38a; --bad:#ef6b5f; --chip:#1d2740; --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#0f1524; --paper:#161e31; --ink:#e7e9ef; --muted:#9aa3b5; --line:#263049; --grid:#222b41;
  --navy:#0b1120; --amber:#f0b45a; --amber-ink:#f0b45a; --ok:#4cc38a; --bad:#ef6b5f; --chip:#1d2740; --shadow:none;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em;margin:0}
button{font:inherit;cursor:pointer;color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
/* üst bar */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#f3efe6;display:flex;gap:16px;align-items:center;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-weight:800;font-size:19px}
.brand .lens{width:30px;height:30px;border-radius:50%;border:3px solid var(--amber);position:relative}
.brand .lens:after{content:"";position:absolute;width:10px;height:3px;background:var(--amber);right:-8px;bottom:-3px;transform:rotate(45deg)}
.stats{display:flex;gap:14px;align-items:center;margin-left:auto;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#aab3c7}
.stat b{font:600 16px "IBM Plex Mono",monospace;color:#fff;letter-spacing:0;text-transform:none}
.lvl{min-width:200px}
.bar{height:8px;background:#2a3655;border-radius:9px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#ffd58a);border-radius:9px;transition:width .6s}
.iconbtn{background:#24304f;border:0;border-radius:8px;padding:7px 10px;color:#fff}
.iconbtn:hover{background:#2f3d63}
/* yerleşim */
.wrap{display:grid;grid-template-columns:290px 1fr;gap:22px;max-width:1360px;margin:0 auto;padding:20px 18px 60px}
aside{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 92px);overflow:auto;padding-right:4px}
.zone{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.zone>button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:11px 12px;text-align:left}
.zone .em{font-size:20px;width:30px;text-align:center}
.zone .zt{flex:1}
.zone .zt small{display:block;color:var(--muted);font-size:12px}
.zone.locked{opacity:.5}
.zone.done{border-color:var(--amber)}
.zone ul{list-style:none;margin:0;padding:0 8px 8px}
.zone li button{width:100%;display:flex;gap:8px;align-items:center;background:none;border:0;border-radius:8px;padding:6px 8px;text-align:left;font-size:13.5px}
.zone li button:hover{background:var(--chip)}
.zone li button.cur{background:var(--chip);font-weight:600}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px;color:#fff}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.bad{background:var(--bad);border-color:var(--bad)}
.side-extra button{width:100%;margin-top:6px;padding:11px 12px;border-radius:12px;border:1px dashed var(--amber);background:transparent;text-align:left;font-weight:600}
.side-extra button:hover{background:var(--chip)}
/* görev kartı */
main{min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px}
.mhead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.num{font:600 13px "IBM Plex Mono",monospace;background:var(--amber);color:#1c1405;padding:4px 9px;border-radius:7px}
.mhead h2{font-size:28px;line-height:1.15}
.mhead .en{color:var(--muted);font-size:14px;margin-top:3px}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--muted);text-decoration:none;white-space:nowrap}
a.pill:hover{color:var(--amber-ink)}
.brief{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 6px}
.brief div{background:var(--chip);border-radius:12px;padding:12px 14px;font-size:14px}
.brief b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber-ink);margin-bottom:3px}
.chart{min-height:380px;margin:8px -6px 0}
.chart+.chart{margin-top:14px}
.quiz{margin-top:18px;border-top:2px dashed var(--line);padding-top:18px}
.quiz h3{font-size:20px;display:flex;gap:10px;align-items:center}
.quiz .qtext{font-size:17px;font-weight:600;margin:10px 0 14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;text-align:left;font-weight:500;transition:transform .12s,border-color .12s}
.opt:hover:not(:disabled){border-color:var(--amber);transform:translateY(-1px)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--paper))}
.opt .k{font:600 12px "IBM Plex Mono",monospace;color:var(--muted);margin-right:8px}
.qbar{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--navy);color:#fff}
:root[data-theme="dark"] .btn{background:#2a3a63}
.btn.amber{background:var(--amber);color:#1c1405}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.msg{font-size:14px;color:var(--muted)}
.hint{margin-top:12px;padding:12px 14px;border-left:4px solid var(--amber);background:var(--chip);border-radius:0 10px 10px 0;font-size:14px}
.bulgu{margin-top:14px;padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--ok) 10%,var(--paper));border:1px solid color-mix(in srgb,var(--ok) 40%,var(--line));white-space:pre-wrap;font-size:14px}
.bulgu b{display:block;font-family:Fraunces,serif;font-size:16px;margin-bottom:4px}
details.code{margin-top:16px}
details.code summary{cursor:pointer;font-weight:600;color:var(--muted)}
details.code pre{background:#0f1524;color:#dfe6f3;border-radius:10px;padding:14px;overflow:auto;font:12.5px/1.5 "IBM Plex Mono",monospace;max-height:420px;position:relative}
.copy{float:right;margin-top:8px}
.shake{animation:shake .38s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.float{position:fixed;pointer-events:none;font:700 22px "IBM Plex Mono",monospace;color:var(--amber);z-index:60;animation:up 1.2s forwards;text-shadow:0 1px 0 #0003}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
/* modal, toast */
.modal{position:fixed;inset:0;background:#0b1120cc;display:none;place-items:center;z-index:50;padding:16px}
.modal.show{display:grid}
.modal .box{background:var(--paper);border-radius:18px;max-width:640px;width:100%;padding:28px;box-shadow:0 20px 60px #0006;max-height:92vh;overflow:auto}
.toast{position:fixed;right:18px;bottom:18px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;z-index:70;transform:translateY(130%);transition:transform .35s;max-width:330px;border-left:5px solid var(--amber)}
.toast.show{transform:none}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--chip);filter:grayscale(1);opacity:.45;border:2px solid transparent}
.badge.on{filter:none;opacity:1;border-color:var(--amber);background:color-mix(in srgb,var(--amber) 20%,var(--paper))}
.intro h1{font-size:34px;line-height:1.1}
.rules{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}
.rules div{background:var(--chip);border-radius:12px;padding:12px;font-size:13.5px}
.rules b{font-family:"IBM Plex Mono",monospace;color:var(--amber-ink);font-size:18px;display:block}
input[type=text]{font:inherit;width:100%;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--amber)}
.timer{height:10px;background:var(--chip);border-radius:9px;overflow:hidden;margin:12px 0}
.timer i{display:block;height:100%;background:var(--amber);transition:width 1s linear}
/* sertifika */
.cert{border:3px double var(--amber);border-radius:14px;padding:30px;text-align:center;background:var(--paper)}
.cert h1{font-size:30px;margin:6px 0}
.cert .who{font-family:Fraunces,serif;font-size:34px;font-weight:800;color:var(--amber-ink);margin:14px 0 4px;border-bottom:1px solid var(--line);display:inline-block;padding:0 24px 6px}
.cert .row{display:flex;justify-content:center;gap:26px;margin:16px 0;flex-wrap:wrap}
.cert .row div{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cert .row b{display:block;font:600 22px "IBM Plex Mono",monospace;color:var(--ink);text-transform:none;letter-spacing:0}

.pybar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 8px}
.pybar .btn{padding:8px 14px}
textarea#codeEl{width:100%;min-height:220px;max-height:560px;resize:vertical;background:#0f1524;color:#dfe6f3;border:2px solid #0f1524;border-radius:10px;padding:14px;font:12.5px/1.55 "IBM Plex Mono",monospace;tab-size:4;white-space:pre;overflow:auto}
textarea#codeEl:focus{outline:none;border-color:var(--amber)}
.pyk{font-size:12px;color:var(--muted)}
#pyOut{margin-top:12px}
#pyOut .pytxt{background:var(--chip);color:var(--ink);max-height:340px;border-radius:10px;padding:12px 14px;font:12.5px/1.5 "IBM Plex Mono",monospace;white-space:pre-wrap;overflow:auto;max-height:340px;margin:8px 0}
#pyOut .pyerr{background:color-mix(in srgb,var(--bad) 12%,var(--paper));border:1px solid color-mix(in srgb,var(--bad) 45%,var(--line));color:var(--ink)}
#pyOut img{max-width:100%;border-radius:10px;border:1px solid var(--line);background:#fff;margin:8px 0;display:block}
#pyOut .chart{min-height:360px}
.pylabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber-ink);font-weight:600;margin-top:10px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--amber);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:80}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  aside{position:static;max-height:none}
  .brief,.opts,.rules{grid-template-columns:1fr}
  .lvl{min-width:140px}
  .mhead h2{font-size:23px}
}
@media print{
  body *{visibility:hidden}
  #certBox,#certBox *{visibility:visible}
  #certBox{position:absolute;left:0;top:0;width:100%}
  .noprint{display:none!important}
}
</style>
</head>

<div class="wrap">

  <main id="main"></main>
</div>

<script type="text/plain" id="pyHarness">import io, sys, json, base64, traceback
import matplotlib
matplotlib.use("agg")
import matplotlib.pyplot as plt
import plotly.graph_objects as go

_OUT = []

def _fig_show(self, *a, **k):
    _OUT.append({"t": "plotly", "v": self.to_json()})

def _plt_show(*a, **k):
    for n in plt.get_fignums():
        f = plt.figure(n)
        b = io.BytesIO()
        f.savefig(b, format="png", dpi=110, bbox_inches="tight", facecolor="white")
        _OUT.append({"t": "png", "v": base64.b64encode(b.getvalue()).decode()})
    plt.close("all")

go.Figure.show = _fig_show
plt.show = _plt_show

def _run(code, setup, rng_state=""):
    global _OUT
    _OUT = []
    plt.close("all")
    ns = {"__name__": "__main__"}
    buf, old = io.StringIO(), sys.stdout
    sys.stdout = buf
    err = None
    try:
        exec(compile(setup, "<kurulum>", "exec"), ns)
        if rng_state:
            ns["rng"].bit_generator.state = json.loads(rng_state)
        exec(compile(code, "<hücre>", "exec"), ns)
        _plt_show()
    except Exception:
        tb = traceback.format_exc().splitlines()
        # kullanıcı hücresine ait kısmı öne çıkar
        err = "\n".join([tb[0]] + [l for l in tb[1:] if "pyharness" not in l and "_run" not in l])
    finally:
        sys.stdout = old
    return json.dumps({"out": buf.getvalue(), "err": err, "items": _OUT})

function toast(html, ms = 2800) { const t = $("#toast"); t.innerHTML = html; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), ms); }

function confetti() {
  const c = $("#conf"), x = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const cols = ["#e8a33d", "#16223d", "#2f8a5b", "#c2453a", "#88CCEE", "#ffd58a"];
  const P = Array.from({length: 160}, () => ({x: Math.random() * c.width, y: -20 - Math.random() * c.height * .4, vx: (Math.random() - .5) * 4, vy: 2 + Math.random() * 4,
    s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[Math.random() * cols.length | 0]}));
  let t = 0; (function f() { x.clearRect(0, 0, c.width, c.height);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .05; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (++t < 170) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height); })();
}

function themed(layout) {
  const cs = getComputedStyle(document.documentElement), v = k => cs.getPropertyValue(k).trim();
  const L = JSON.parse(JSON.stringify(layout || {}));
  delete L.width; L.autosize = true;
  L.paper_bgcolor = "rgba(0,0,0,0)"; L.plot_bgcolor = "rgba(0,0,0,0)";
  L.font = Object.assign({family: "IBM Plex Sans, sans-serif", size: 12.5}, L.font || {}, {color: v("--ink")});
  if (L.title) { L.title = typeof L.title === "string" ? {text: L.title} : L.title; L.title.font = {family: "Fraunces, serif", size: 17, color: v("--ink")}; L.title.x = 0.01; }
  L.margin = Object.assign({t: 60, r: 20, b: 50, l: 60}, L.margin || {});
  Object.keys(L).filter(k => /^[xy]axis\d*$/.test(k)).forEach(k => Object.assign(L[k], {gridcolor: v("--grid"), zerolinecolor: v("--line"), linecolor: v("--line")}));
  if (!L.xaxis) L.xaxis = {gridcolor: v("--grid")}; if (!L.yaxis) L.yaxis = {gridcolor: v("--grid")};
  if (L.polar) { L.polar.bgcolor = "rgba(0,0,0,0)"; L.polar.radialaxis = Object.assign(L.polar.radialaxis || {}, {gridcolor: v("--grid")}); L.polar.angularaxis = Object.assign(L.polar.angularaxis || {}, {gridcolor: v("--grid")}); }
  if (L.geo) Object.assign(L.geo, {bgcolor: "rgba(0,0,0,0)"});
  L.hoverlabel = {font: {family: "IBM Plex Sans"}};
  return L;
}
function plotAll(m) {

  m.fig.forEach((f, i) => Plotly.newPlot("ch" + i, JSON.parse(JSON.stringify(f.data)), themed(f.layout), {responsive: true, displaylogo: false, locale: "tr"}));

      <div id="pyOut"></div></details>

const hintHTML = m => `<div class="hint"><b>İpucu:</b> ${esc(m.q.hint)}<br><b>Nasıl okunur?</b> ${esc(m.oku)}</div>`;
const bulguHTML = (m, a) => `<div class="bulgu"><b>${a.ok ? "Vaka çözüldü ✓" : "Doğru cevap: " + esc(m.q.opts[m.q.correct])}</b>${esc(m.bulgu)}</div>`;
function markOpts(m, a) {
  document.querySelectorAll(".opt").forEach((b, i) => { b.disabled = true; if (i === m.q.correct) b.classList.add("right"); else if ((a.wrong || []).includes(i)) b.classList.add("wrong"); });
}
function answer(m, i, btn) {
  const a = S.ans[m.n] || (S.ans[m.n] = {tries: 0, wrong: []});
  if (a.done) return;
  a.tries++;
  const before = level(S.xp);
  if (i === m.q.correct) {
    let gain = a.tries === 1 ? 100 : 50; if (S.hints[m.n]) gain -= 20;
    S.streak++; S.best = Math.max(S.best, S.streak);
    const bonus = S.streak >= 3 ? 5 * Math.min(S.streak, 10) : 0;
    S.xp += gain + bonus; a.done = true; a.ok = true; a.xp = gain + bonus;
    floatXP(`+${gain + bonus} XP`, btn);
    $("#qmsg").textContent = bonus ? `Doğru! 🔥 ${S.streak}'li seri bonusu +${bonus}` : "Doğru!";
  } else {
    a.wrong.push(i); btn.classList.add("wrong", "shake"); btn.disabled = true;
    if (a.tries >= 2) { a.done = true; a.ok = false; S.streak = 0; $("#qmsg").textContent = "Bu vakayı kaçırdın — seri sıfırlandı. Bulguyu oku, sonrakine geç."; }
    else { $("#qmsg").textContent = "Yanlış iz! Bir hakkın daha var (+50 XP)."; save(); renderStats(); return; }
  }

  $("#hintBox").innerHTML = hintHTML(m); $("#hintBtn").disabled = true;
  $("#bulguBox").innerHTML = bulguHTML(m, a); $("#nextBtn").hidden = false;

  const z = zoneOf(m.n);
  if (zoneDone(z) && !S["z_" + z.id]) { S["z_" + z.id] = 1; save(); setTimeout(() => zoneReward(z), 700); }
}
function zoneReward(z) {

  const ok = z.missions.filter(n => S.ans[n].ok).length, nz = D.zones[D.zones.indexOf(z) + 1];

    <p class="msg">${esc(z.ad)} bölümünde ${ok}/${z.missions.length} vakayı ilk elden çözdün.</p>

function nextMission() {

/* ---------- Pyodide: Python kodunu tarayıcıda çalıştırma ---------- */
const PYODIDE_URL = "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/";
let PY = null, pyLoading = null, pyBusy = false;
const EDIT = {};
function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("Betik yüklenemedi: " + src)); document.head.appendChild(s); }); }
function getPy(status) {
  if (PY) return Promise.resolve(PY);
  if (!pyLoading) pyLoading = (async () => {
    status("Pyodide (WebAssembly Python) indiriliyor…");
    if (!window.loadPyodide) await loadScript(PYODIDE_URL + "pyodide.js");
    const py = await loadPyodide({indexURL: PYODIDE_URL});
    status("Paketler yükleniyor: pandas, numpy, matplotlib, scipy, scikit-learn, statsmodels…");
    await py.loadPackage(["pandas", "numpy", "matplotlib", "scipy", "scikit-learn", "statsmodels", "micropip"]);
    status("PyPI'den yükleniyor: plotly, seaborn…");
    const mp = py.pyimport("micropip"); await mp.install(["plotly==6.3.0", "seaborn==0.13.2"]);
    py.FS.writeFile("ik_grafik_verisi.csv", $("#csvData").textContent);
    status("Çalışma ortamı hazırlanıyor…");
    await py.runPythonAsync($("#pyHarness").textContent);
    PY = py; return py;
  })().catch(e => { pyLoading = null; throw e; });
  return pyLoading;
}
function bindCode(m) {
  const ta = $("#codeEl");
  ta.value = EDIT[m.n] ?? m.code;
  ta.rows = Math.min(30, Math.max(10, ta.value.split("\n").length + 1));
  ta.oninput = () => { EDIT[m.n] = ta.value; };
  ta.onkeydown = e => {
    if (e.key === "Tab") { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText("    ", s, ta.selectionEnd, "end"); EDIT[m.n] = ta.value; }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runCode(m); }
  };
  $("#codeBox").ontoggle = () => { S.codeOpen = $("#codeBox").open; save(); };
  $("#copyBtn").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(ta.value).then(() => toast("Kod panoya kopyalandı."), () => toast("Kopyalanamadı; kodu seçip kopyalayın.")); };
  $("#resetCode").onclick = () => { delete EDIT[m.n]; ta.value = m.code; $("#pyOut").innerHTML = ""; toast("Orijinal kod geri yüklendi."); };
  $("#runBtn").onclick = () => runCode(m);
}
async function runCode(m) {
  if (pyBusy) return;
  const still = () => S.cur === m.n && $("#pyOut");
  const stat = h => { if (still()) $("#pyStat").innerHTML = h; };
  const status = t => stat(`<span class="spin"></span>${esc(t)}`);
  pyBusy = true; $("#runBtn").disabled = true;
  try {
    const py = await getPy(status);
    if (!still()) return;
    status("Çalışıyor…"); await new Promise(r => setTimeout(r, 40));
    const t0 = performance.now();
    const res = JSON.parse(py.globals.get("_run")($("#codeEl").value, $("#setupCode").textContent, m.rng || ""));
    if (!still()) return;
    renderPyOut(res);
    const sn = ((performance.now() - t0) / 1000).toFixed(1);
    if (res.err) stat(`⚠️ Hata (${sn} sn). Kodu düzeltip tekrar deneyin ya da “Orijinal kod”a dönün.`);
    else {
      stat(`✓ Çalıştı (${sn} sn) · ${res.items.length} grafik`);
      S.ran = S.ran || {};
      if (!S.ran[m.n]) { S.ran[m.n] = 1; S.xp += 10; save(); renderStats(); floatXP("+10 XP", $("#runBtn")); }
    }
  } catch (e) {
    stat(`⚠️ Python yüklenemedi: ${esc(e.message || e)}. İnternet bağlantısını kontrol edip tekrar deneyin.`);
  } finally { pyBusy = false; const b = $("#runBtn"); if (b) b.disabled = false; }
}
function renderPyOut(res) {
  const o = $("#pyOut"); o.innerHTML = "";
  const add = (cls, txt, lab) => { if (lab) o.insertAdjacentHTML("beforeend", `<div class="pylabel">${lab}</div>`);
    const p = document.createElement("pre"); p.className = cls; p.textContent = txt; o.appendChild(p); };
  if (res.items.length) o.insertAdjacentHTML("beforeend", `<div class="pylabel">Grafik çıktısı</div>`);
  res.items.forEach((it, i) => {
    if (it.t === "png") { const img = new Image(); img.src = "data:image/png;base64," + it.v; img.alt = "matplotlib çıktısı"; o.appendChild(img); }
    else { const d = document.createElement("div"); d.className = "chart"; d.id = "pyc" + i; o.appendChild(d);
      const f = JSON.parse(it.v); if (window.Plotly) Plotly.newPlot(d, f.data, themed(f.layout), {responsive: true, displaylogo: false}); }
  });
  if (res.out.trim()) add("pytxt", res.out.replace(/\s+$/, ""), "Konsol çıktısı");
  if (res.err) add("pytxt pyerr", res.err, "Hata");
  if (!res.items.length && !res.out.trim() && !res.err) add("pytxt", "(Çıktı yok)", "Konsol çıktısı");
}

/* ---------- mini oyun ---------- */
function miniGame() {
  const pool = D.guide.slice().sort(() => Math.random() - .5).slice(0, 10), names = [...new Set(D.guide.map(g => g.grafik))];
  let r = 0, score = 0, timer, left;
  function round() {
    if (r >= pool.length) return finish();
    const g = pool[r], opts = [g.grafik, ...names.filter(x => x !== g.grafik).sort(() => Math.random() - .5).slice(0, 3)].sort(() => Math.random() - .5);
    left = 15;
    modal(`<h2>🎯 Grafik Avcısı <span class="mono msg" style="font-size:14px">tur ${r + 1}/10 · puan ${score}</span></h2>
      <div class="timer"><i id="tm" style="width:100%"></i></div>
      <p style="font-size:17px;font-weight:600">${esc(g.soru)}</p>
      <div class="opts">${opts.map(o => `<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>
      <p class="msg" id="mgmsg">Bu İK sorusuna en uygun grafik hangisi?</p>`);
    clearInterval(timer);
    timer = setInterval(() => { left--; const t = $("#tm"); if (t) t.style.width = (left / 15 * 100) + "%"; if (left <= 0) pick(null); }, 1000);
    document.querySelectorAll("#modalBox .opt").forEach(b => b.onclick = () => pick(b));
    function pick(b) {
      clearInterval(timer);
      const ok = b && b.dataset.o === g.grafik;
      document.querySelectorAll("#modalBox .opt").forEach(x => { x.disabled = true; if (x.dataset.o === g.grafik) x.classList.add("right"); });
      if (b && !ok) b.classList.add("wrong");
      if (ok) score += 20 + left * 2;
      $("#mgmsg").textContent = ok ? `Doğru! +${20 + left * 2}` : (b ? "Yanlış." : "Süre doldu!") + ` Doğru cevap: ${g.grafik}`;
      r++; setTimeout(round, 1300);
    }
  }
  function finish() {
    const gain = Math.max(0, score - S.mg), before = level(S.xp); S.mg = Math.max(S.mg, score); S.xp += gain; save(); renderStats();
    if (score >= 300) confetti();
    modal(`<div style="text-align:center"><h2>Oyun bitti!</h2><p style="font:600 40px 'IBM Plex Mono'">${score}</p>
      <p class="msg">En iyi skorun: ${S.mg}. ${gain ? `Rekor kırdın: <b>+${gain} XP</b> eklendi.` : "XP yalnızca rekor kırınca eklenir."}</p>
      <button class="btn amber" onclick="miniGame()">Tekrar oyna</button> <button class="btn ghost" onclick="closeModal()">Kapat</button></div>`);
    if (level(S.xp) > before) toast(`<b>Seviye atladın!</b><br>${LEVELS[level(S.xp)][1]}`);
  }
  round();
}

/* ---------- sertifika ---------- */
function showCert() {
  const done = Object.values(S.ans).filter(a => a.done), ok = done.filter(a => a.ok).length, L = LEVELS[level(S.xp)];
  const all = done.length === 41;
  modal(`<div id="certBox"><div class="cert">
    <div class="msg" style="letter-spacing:.2em;text-transform:uppercase">${all ? "Başarı Sertifikası" : "İlerleme Belgesi"}</div>
    <h1>İK Veri Görselleştirme</h1>
    <div class="who">${esc(S.name || "İsimsiz Dedektif")}</div>
    <p>${all ? "41 grafik vakasının tamamını çözerek" : `41 vakadan ${done.length} tanesini çözerek`} <b>${L[2]} ${L[1]}</b> unvanını kazanmıştır.</p>
    <div class="row"><div>XP<b>${S.xp}</b></div><div>Doğruluk<b>${done.length ? Math.round(ok / done.length * 100) : 0}%</b></div><div>En uzun seri<b>${S.best}</b></div><div>Grafik Avcısı<b>${S.mg}</b></div></div>
    <div class="badges" style="justify-content:center">${D.zones.map(z => `<div class="badge ${zoneDone(z) ? "on" : ""}" title="${esc(z.rozet)}">${z.emoji}</div>`).join("")}</div>
    <p class="msg" style="margin-top:16px">${new Date().toLocaleDateString("tr-TR", {day: "numeric", month: "long", year: "numeric"})} · Grafik türleri: visualizing.org · Veriler sentetiktir</p></div></div>
    <div class="noprint" style="text-align:center;margin-top:16px"><button class="btn amber" onclick="window.print()">🖨️ Yazdır / PDF</button> <button class="btn ghost" onclick="closeModal()">Kapat</button></div>`);
}

    <div class="rules"><div><b>+100</b>İlk denemede doğru cevap</div><div><b>🔥 seri</b>3 doğru üst üste gelince her doğruya +15…+50 bonus XP</div><div><b>▶ Python</b>Her grafiğin kodunu tarayıcıda çalıştır, değiştir, sonucu gör (+10 XP)</div><div><b>9 rozet</b>Her bölümü bitirince yeni bölüm ve rozet açılır · 🎯 mini oyun · 🏅 sertifika</div></div>

}
$("#menuBtn").onclick = () => modal(`<h2>Ayarlar</h2>
  <p><label><input type="checkbox" id="freeChk" ${S.free ? "checked" : ""}> Eğitmen modu: tüm bölümleri aç</label></p>
  <p><label class="msg" for="nm2">Ad</label><input type="text" id="nm2" value="${esc(S.name)}"></p>
  <p style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn amber" id="saveSet">Kaydet</button>
  <button class="btn ghost" id="resetBtn" style="color:var(--bad)">İlerlemeyi sıfırla</button></p>`) || setTimeout(() => {
  $("#saveSet").onclick = () => { S.free = $("#freeChk").checked; S.name = $("#nm2").value.trim(); save(); closeModal(); renderAll(); };
  $("#resetBtn").onclick = () => { if (confirm("Tüm XP, cevaplar ve rozetler silinsin mi?")) { const th = S.theme; S = {name: S.name, xp: 0, streak: 0, best: 0, ans: {}, hints: {}, mg: 0, free: false, cur: 1, theme: th, started: true}; save(); closeModal(); renderAll(); } };
}, 0);
$("#themeBtn").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  S.theme = dark ? "light" : "dark"; document.documentElement.dataset.theme = S.theme; save(); plotAll(M[S.cur]);
};

function dataModal() {
  modal(`<h2>📦 Veri seti</h2>
  <p>Oyundaki 41 grafiğin tamamı <b>ik_grafik_verisi.csv</b> dosyasındaki sentetik veriden üretildi. Dosyada altı tablo var; hangi satırın hangi tabloya ait olduğunu <code>tablo</code> sütunu gösterir:
  <code>calisan</code> (800), <code>aylik</code> (288), <code>anket</code> (6), <code>devamsizlik_gunluk</code> (365), <code>pozisyon</code> (269), <code>yetkinlik</code> (8).</p>
  <p><button class="btn amber" id="dlCsv">⬇️ CSV'yi indir</button></p>
  <p>Notebook'un ilk hücresine aşağıdaki kurulum kodunu koyun; ardından her görevdeki Python kodunu sırayla çalıştırdığınızda oyundaki bulguların aynısını elde edersiniz. Kodları hiçbir kurulum yapmadan oyunun içinde de çalıştırabilirsiniz: her görevin “🐍 Python kodu” bölümündeki <b>▶ Çalıştır</b> düğmesi, Python'u tarayıcıda (Pyodide) çalıştırır.</p>
  <p><button class="btn ghost" id="warmPy">⚡ Python'u şimdi hazırla</button> <span class="msg" id="warmStat"></span></p>
  <details class="code" open><summary>Kurulum hücresi</summary><button class="btn ghost copy" id="cpSetup">Kopyala</button><pre><code id="setupEl"></code></pre></details>
  <p style="text-align:right"><button class="btn ghost" onclick="closeModal()">Kapat</button></p>`);
  const setup = $("#setupCode").textContent;
  $("#setupEl").textContent = setup;
  $("#cpSetup").onclick = () => navigator.clipboard && navigator.clipboard.writeText(setup).then(() => toast("Kurulum kodu kopyalandı."));
  $("#dlCsv").onclick = () => {
    const b = new Blob(["﻿" + $("#csvData").textContent], {type: "text/csv;charset=utf-8"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "ik_grafik_verisi.csv";
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);

}
$("#dataBtn").onclick = () => { dataModal();
  const w = $("#warmPy"), st = t => { const e = $("#warmStat"); if (e) e.textContent = t; };
  if (PY) { w.disabled = true; st("Python hazır."); }
  w.onclick = () => { w.disabled = true; getPy(st).then(() => st("Python hazır ✓ Görevlerde ▶ Çalıştır'a basabilirsiniz."), e => { w.disabled = false; st("Yüklenemedi: " + (e.message || e)); }); };
};
$("#mgBtn").onclick = miniGame; $("#certBtn").onclick = showCert;
document.addEventListener("keydown", e => {
  if ($("#modal").classList.contains("show") || /input|textarea/i.test(e.target.tagName)) return;
  const k = "abcd1234".indexOf(e.key.toLowerCase()); if (k >= 0) { const b = document.querySelectorAll(".opt")[k % 4]; if (b && !b.disabled) b.click(); }
  if (e.key === "Enter" && !$("#nextBtn").hidden) nextMission();
});
function renderAll() { if (!zoneOpen(zoneOf(S.cur))) S.cur = 1; renderStats(); renderSide(); renderMission(); }
renderAll();
if (!S.started) intro();
